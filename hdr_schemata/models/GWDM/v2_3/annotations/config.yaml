linkage:
  waveOf:
    title: "Wave of"
    description: "The study this dataset is a wave or sub-study of. Which wave it is lives in population.wave."

population:
  title: "Population"
  description: "Population-research detail: study design, wave, recruitment, follow-up and eligibility."
  studyDesign:
    title: "Study design"
    description: "Characteristics of the study design. Leave a value empty if it is not known; false means the study is known not to have that characteristic."
    isLongitudinal:
      title: "Longitudinal"
      description: "Whether the study follows the same participants over time."
    isFamilyBased:
      title: "Family-based"
      description: "Whether participants are recruited as families (related individuals) rather than as unrelated individuals."
    isClinicalBased:
      title: "Clinical-based sample"
      description: "Whether participants are recruited through a clinical setting rather than from the general population."
  wave:
    title: "Wave"
    description: "Which wave or sub-study of the parent study this dataset represents."
    waveId:
      title: "Wave identifier"
      description: "Identifier for this wave, unique within the parent study."
      examples:
        - "wave-1"
        - "genotyping-2015"
    waveType:
      title: "Wave type"
      description: "Whether this is a contact wave (participants were contacted and data collected) or a sub-study (further analysis, such as an assay, of data or samples collected in an earlier wave)."
    waveNumber:
      title: "Wave number"
      description: "Position of this contact wave within the parent study, starting from 1. Leave empty for sub-studies."
    label:
      title: "Wave label"
      description: "Human-readable name for this wave."
      examples:
        - "2015 genotyping"
  recruitment:
    title: "Recruitment"
    description: "How and when participants were recruited."
    status:
      title: "Recruitment status"
      description: "Whether the study is currently recruiting."
    startDate:
      title: "Recruitment start date"
      description: "Date recruitment began."
    endDate:
      title: "Recruitment end date"
      description: "Date recruitment ended. Leave empty if recruitment is ongoing."
    samplingMethod:
      title: "Sampling method"
      description: "How participants were identified and approached."
  followUpSchedule:
    title: "Follow-up schedule"
    description: "Whether participants are actively re-contacted, and how often. This is different from coverage.followUp, which records how long, in total, a participant appears in the dataset."
    frequency:
      title: "Follow-up frequency"
      description: "How often participants are re-contacted. Select 'No scheduled follow-up' if they are not re-contacted on a schedule."
    note:
      title: "Follow-up note"
      description: "Any further detail on the follow-up schedule."
  eligibility:
    title: "Eligibility"
    description: "Who could take part in the study."
    inclusionCriteria:
      title: "Inclusion criteria"
      description: "Criteria a participant had to meet to take part."
    exclusionCriteria:
      title: "Exclusion criteria"
      description: "Criteria that excluded a participant from taking part."

required:
  recordType:
    title: "Record type"
    description: "What kind of record this is. Records without a type are datasets."

crocod:
  title: "Case study (CROCOD)"
  description: "Trial case study content that has no home in the core GWDM sections. Present only on records whose required.recordType is caseStudy. Title, acronym, participant count, trial years and participant locations are stored in summary, provenance.temporal and coverage instead."
  trialStatus:
    title: "Trial status"
    description: "Current status of the trial."
  therapeuticArea:
    title: "Therapeutic area"
    description: "Disease or clinical area the trial addresses."
  laySummary:
    title: "Lay summary"
    description: "Plain-language summary of the trial, in full."
  background:
    title: "Background"
    description: "Clinical and research background to the trial, in full."
  trialDesign:
    title: "Trial design"
    description: "How the trial was designed and registered."
    categories:
      title: "Trial design (categories)"
      description: "Design classification of the trial, for example masking, control and phase."
    designDescription:
      title: "Trial design (description)"
      description: "Description of the trial design."
    registration:
      title: "Trial registration"
      description: "Registry identifiers for the trial."
  governance:
    title: "Governance"
    description: "Who sponsored, funded, approved and led the trial."
    sponsor:
      title: "Sponsor"
      description: "Sponsor of the trial."
    funder:
      title: "Funder"
      description: "Funder of the trial, in full."
    approvingBody:
      title: "Approving body (for data)"
      description: "Body that approved access to the data."
    principalInvestigator:
      title: "Principal investigator"
      description: "Name of the trial's principal investigator."
    contactPoints:
      title: "Trial contact information"
      description: "Email addresses for contacting the trial team."
  healthSystemsData:
    title: "Health systems data"
    description: "How the trial used health systems data (HSD), and which data it applied for."
    usedFor:
      title: "Health systems data (HSD) used for"
      description: "What the trial used health systems data for."
    dataProvidersAppliedTo:
      title: "Data providers applied to"
      description: "Data custodians the trial applied to for data, Gateway or not."
    datasetsAccessed:
      title: "Datasets accessed"
      description: "Datasets the trial accessed, Gateway or not."
    yearFirstAppliedFor:
      title: "Date data first applied for"
      description: "Year the trial first applied for health systems data."
  learnings:
    title: "Learnings"
    description: "What the trial learned from using health systems data, by area."
    recruitment:
      title: "Recruitment learnings"
      description: "Learnings about using health systems data for recruitment."
    pharmacovigilance:
      title: "Pharmacovigilance learnings"
      description: "Learnings about using health systems data for pharmacovigilance."
    outcomeAscertainment:
      title: "Outcome Ascertainment learnings"
      description: "Learnings about using health systems data for outcome ascertainment."
    patientPublicInvolvement:
      title: "Patient and Public Involvement learnings"
      description: "Learnings about patient and public involvement."
    additionalInsights:
      title: "Additional Insights"
      description: "Any further insights from the trial."
  publications:
    title: "Publications"
    description: "Publications from the trial, Gateway or not."
  readMore:
    title: "Read more"
    description: "Further documents or links about the trial."
