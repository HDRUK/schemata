documentation:
  _description: Documentation can include a rich text description of the dataset or links to media such as documents, images, presentations, videos or links to data dictionaries, profiles or dashboards. Organisations are required to confirm that they have permission to distribute any additional media.
  _title: Documentation
  associatedMedia:
    description: 'Please provide any media associated with the Gateway Organisation using a valid URL for the content. This is an opportunity to provide additional context that could be useful for researchers wanting to understand more about the dataset and its relevance to their research question. The following formats will be accepted .jpg, .png or .svg, .pdf, .xslx or .docx. Note: media asset can be hosted by the organisation or uploaded using the onboarding portal.'
    examples:
    - PDF document that describes study protocol - https://link.to/document.pdf
    guidance: '- Please provide any media associated with the Gateway Organisation **using a valid URL** for the content.\n- This is an opportunity to **provide additional context** that could be useful for researchers wanting to understand more about the dataset and its relevance to their research question.\n- Note: media assets should be hosted by the organisation.

      - **Example**: This could be a **link to a PDF Document** that describes methodology or further detail about the datasets, or a graph or chart that provides further context about the dataset.\n- If you are providing multiple links for associated media, we recommend that you separate these with a comma.'
    title: Associated media
  description:
    description: 'A free-text description of the dataset.\nA URL can also be provided as the description of the dataset.\nGateway Feature: Keywords and text may be extracted out of the description and indexed for search.'
    examples:
    - CPRD Aurum contains primary care data contributed by General Practitioner (GP) practices using EMIS Web® including patient registration information and all care events that GPs have chosen to record as part of their usual medical practice.
    guidance: '- An HTML account of the data that **provides context and scope** of the data, **limited to 10000 characters, and/or a resolvable URL** that describes the dataset.\n- Additional information can be recorded and included using the Associated media field.'
    title: Description
  inPipeline:
    description: Indicate whether this dataset is currently available for Researchers to request access.
    guidance: If a dataset is being prepared for sharing but not yet ready and available for researchers to apply for access, select 'Not available'. If Researchers can currently apply for access to the dataset, select 'Available'.
    title: Dataset pipeline status
  isPartOf:
    description: Please complete only if the dataset is part of a group or family
    examples:
    - Hospital Episodes Statistics datasets (A&E, APC, OP, AC MSDS).
    title: Group
enrichmentAndLinkage:
  derivation:
    description: Indicate if derived datasets or predefined extracts are available and the type of derivation available. Notes. Single or multiple dimensions can be provided as a derived extract alongside the dataset.
    title: Derivations
  derivedFrom:
    description: If applicable, please provide DOIs or links to datasets from which data in this dataset has been derived or calculated from.
    title: Derived from
  description: This section includes information about related datasets that may have previously been linked, as well as indicating if there is the opportunity to link to other datasets in the future. If a dataset has been enriched and/or derivations, scores and existing tools are available this section allows providers to indicate this to researchers.
  investigations:
    description: Please provide link to any active projects that are using the dataset.
    guidance: '- Please provide the website address(es) which document information related to active projects utilising the dataset.\n- Please split your existing list of citations into separate fields.\n- To add multiple entries, type in each website and press enter to add it to the list.\n- **Example**: <https://dataloch.org/insights/projects-delivered/data-driven-innovation-multi-morbidity-report-partner-gps>'
    title: Investigations
  isPartOf:
    description: 'This relationship indicates that the dataset is a component or subset of a broader collection of related datasets. For example, clinical trial data for a specific drug may be part of a larger database of pharmaceutical research data. Complete only if the dataset is part of a group or family of datasets i.e. Hospital Episode Statistics has several constituents. If your dataset is not part of a group, please enter “NOT APPLICABLE” **Example**: Hospital Episodes Statistics datasets (A&E, APC, OP, AC MSDS).'
    examples:
    - Hospital Episodes Statistics datasets (A&E, APC, OP, AC MSDS)
    title: Is part of
  linkableDatasets:
    description: If applicable, please provide the DOI of other datasets that have previously been linked to this dataset and their availability. If no DOI is available, please provide the title of the datasets that can be linked.
    title: Linked datasets
  publicationAboutDataset:
    description: DOIs for publications which describe the dataset.
    examples:
    - 10.1093/ije/dyab028
    guidance: '- Please provide the DOIs for publications which describe the dataset.\n- Please split your existing list of citations into separate fields.\n- To add multiple entries, type in each citation and press enter to add it to the list.\n- **Example**: <10.1093/ije/dyab028>'
    title: Publication about the dataset
  publicationUsingDataset:
    description: DOIs for publications which use the dataset for analysis.
    examples:
    - 10.1001/jamapediatrics.2016.3633
    guidance: '- Please provide the DOIs for publications which have used the dataset in their analysis.\n- Please split your existing list of citations into separate fields.\n- To add multiple entries, type in each citation and press enter to add it to the list.\n- **Example**: <10.1001/jamapediatrics.2016.3633>'
    title: Publication using the dataset
  qualifiedRelation:
    description: 'If applicable, please provide the DOI of other datasets that have previously been linked to this dataset and their availability. If no DOI is available, please provide the title of the datasets that can be linked, where possible using the same title of a dataset previously onboarded to the HOP. Note: If all the datasets from Gateway organisation can be linked please indicate “ALL” and the onboarding portal will automate linkage across the datasets submitted.'
    title: Linked Datasets
  similarToDatasets:
    description: Datasets that are similar to each other in some way, collect similar patients, regional equivalent etc.
    title: Similar to datasets
  title: Enrichment and Linkage
  tools:
    description: 'Please provide the URL of any analysis tools or models that have been created for this dataset and are available for further use. Multiple tools may be provided. Note: We encourage users to adopt a model along the lines of https://www.ga4gh.org/news/tool-registry-service-api-enabling-an-interoperable-library-of-genomics-analysis-tools/'
    guidance: '- Please provide the URL of any analysis tools or models that have been created for this dataset and are available for further use.\n- Multiple tools may be provided.\n- Note: We encourage users to adopt a model along the lines of https://www.ga4gh.org/news/tool-registry-service-api-enabling-an-interoperable-library-of-genomics-analysis-tools/'
    title: Tools
