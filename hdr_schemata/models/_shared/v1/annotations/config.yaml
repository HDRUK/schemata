demographicFrequency:
  age:
    bin:
      examples:
      - 30-34 years
      title: Age grouping
    count:
      examples:
      - 1000
      title: Age count
    description: Array of bins, based off the UK Office for National Statistics (ONS) groupings, and their corresponding counts as represented within the dataset.
    guidance: Enter the count of population represented in the dataset within the age bins, based on the dataset’s definition of age (e.g., age at date of admission, age at date of diagnosis). If granular data is not captured for ages <1 month, then all persons <1 year old are stored in the 1-11 months category. Ensure you apply low number suppression and rounding where appropriate.
    title: Age
  description: The statistical characteristics of a population or group within the dataset.
  disease:
    count:
      examples:
      - 1000
      title: Disease count
    description: Array of health conditions or diseases (based around ICD-10, SNOMED CT and MeSH disease vocabularies) and their corresponding counts as represented within the dataset.
    diseaseCode:
      examples:
      - J45
      title: Disease code
    diseaseCodeVocabulary:
      examples:
      - ICD10
      title: Disease code vocabulary
    guidance: Create bins based on standard vocabulary (ICD-10, SNOMED CT or MeSH) and disease code. Then enter the count of population represented in the dataset within the disease bins created. Ensure you apply low number suppression and rounding where appropriate.
    title: Disease
  ethnicity:
    bin:
      examples:
      - Black or Black British - Any other Black background
      title: Ethnicity grouping
    count:
      examples:
