accessibility:
  usage:
    duoCodes:
      title: "GA4GH Data Use Ontology (DUO) codes"
      description: "Machine-readable codes from the GA4GH Data Use Ontology describing the permitted or restricted uses of this dataset, for interoperability with other GA4GH-compliant systems."
      guidance: "Please select any GA4GH Data Use Ontology (DUO) codes that describe the permitted or restricted uses of this dataset, e.g. DUO:0000042 (general research use), DUO:0000021 (ethics approval required). Multiple codes may apply to the same dataset. This is separate from Data use limitation/Data use requirements above, which use HDR UK's own free-text categories rather than the GA4GH ontology's identifiers."
      examples:
        - "DUO:0000042"
    dataUsePermissions:
      title: "Data Use Permissions"
      description: "Permissions relating to how people and materials within this dataset may be used, beyond the general access and use conditions described elsewhere in this section."
      patientRecontact:
        title: "Patient recontact"
        description: "Indicates whether the people from whom the dataset is generated can be recontacted as part of a follow-up or new study."
        guidance: "Please indicate whether the people from whom the dataset is generated can be recontacted as part of a follow-up or new study.\\n- **Yes**: The people within this dataset can be recontacted, subject to any applicable ethical/consent requirements.\\n- **No**: The people within this dataset cannot be recontacted."
        examples:
          - "No"
  formatAndStandards:
    conformsTo:
      guidance: "- List standardised data models that the dataset has been stored in or transformed to, such as OMOP or FHIR.\\n- If the data is only available in a local format, please make that explicit. If you are using a standard that has not been included in the list, please use “other” and contact support desk to ask for an addition.\\n- [**British National Formulary (BNF) codes**](https://bnf.nice.org.uk/)\\n- [**HL7 FHIR**](https://www.hl7.org/fhir/)\\n- [**HL7 V2**](https://www.hl7.org/implement/standards/product_section.cfm?section=13)\\n- [**HL7 CDA**](https://www.hl7.org/implement/standards/product_section.cfm?section=10)\\n- [**HL7 CCOW**](https://www.hl7.org/implement/standards/product_section.cfm?section=16)\\n- [**LOINC**](https://loinc.org/)\\n- [**DDI**](https://ddialliance.org/)\\n- [**DCAT**](https://www.w3.org/TR/vocab-dcat-3/)\\n- [**DICOM**](https://www.dicomstandard.org/)\\n- [**I2B2**](https://www.i2b2.org/)\\n- [**IHE**](https://www.ihe.net/resources/profiles/)\\n- [**OMOP**](https://www.ohdsi.org/data-standardization/the-common-data-model/)\\n- [**openEHR**](https://www.openehr.org/)\\n- [**Sentinel**](https://www.sentinelinitiative.org/sentinel/data/distributed-database-common-data-model)\\n- [**PCORnet**](https://pcornet.org/data-driven-common-model/)\\n- [**CDISC**](https://www.cdisc.org/standards/data-exchange/odm)\\n- **Local**: In-house developed data model.\\n- **Other**: Other standardised data model.\\n- [**NHS Data Dictionary**](https://www.datadictionary.nhs.uk/)\\n- [**NHS Scotland Data Dictionary**](https://www.ndc.scot.nhs.uk/Data-Dictionary/)\\n- [**NHS Wales Data Dictionary**](https://www.datadictionary.wales.nhs.uk/)"
