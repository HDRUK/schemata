site_name: HDRUK Schema
theme:
  name: material
  palette:
    scheme: hdruk
  features:
  - navigation.sections
  - navigation.tabs
  - navigation.top
  - content.code.copy
  - content.tabs.link
extra_css:
- stylesheets/custom.css
markdown_extensions:
- admonition
- pymdownx.details
- pymdownx.superfences
- pymdownx.tabbed:
    alternate_style: true
- pymdownx.highlight:
    anchor_linenums: true
nav:
- Home: index.md
- Contributing:
  - Overview: contributing/index.md
  - Writing a schema: contributing/writing.md
  - Releasing a version: contributing/releasing.md
  - Publishing docs: contributing/publishing.md
- Schemata:
  - Gateway Data Model (GWDM):
    - Version 1.0: GWDM/1.0.md
    - Version 1.1: GWDM/1.1.md
    - Version 1.2: GWDM/1.2.md
    - Version 2.0: GWDM/2.0.md
    - Version 2.1: GWDM/2.1.md
    - Version 3.0: GWDM/3.0.md
  - HDRUK:
    - Version 2.1.2: HDRUK/2.1.2.md
    - Version 2.1.3: HDRUK/2.1.3.md
    - Version 2.2.0: HDRUK/2.2.0.md
    - Version 2.2.1: HDRUK/2.2.1.md
    - Version 3.0.0: HDRUK/3.0.0.md
    - Version 4.0.0: HDRUK/4.0.0.md
    - Version 5.0.0: HDRUK/5.0.0.md
- Schema Change Log:
  - GWDM:
    - '1.1': GWDM/1.1.change.md
    - '1.2': GWDM/1.2.change.md
    - '2.0': GWDM/2.0.change.md
    - '2.1': GWDM/2.1.change.md
    - '3.0': GWDM/3.0.change.md
  - HDRUK:
    - 2.1.3: HDRUK/2.1.3.change.md
    - 2.2.0: HDRUK/2.2.0.change.md
    - 2.2.1: HDRUK/2.2.1.change.md
    - 3.0.0: HDRUK/3.0.0.change.md
    - 4.0.0: HDRUK/4.0.0.change.md
    - 5.0.0: HDRUK/5.0.0.change.md
plugins:
- search
